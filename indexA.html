<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haley's Amazon Favorites</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF6F0;
    --cream2: #F0EBE2;
    --gold: #B8946A;
    --gold-light: #D4B896;
    --dark: #1A1008;
    --brown: #4A3220;
    --tan: #9A7248;
    --white: #ffffff;
    --border: #E2D8CC;
    --radius: 12px;
  }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
  }
  .header-eyebrow {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--tan);
    margin-bottom: 0.5rem;
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.6rem;
    font-weight: 500;
    color: var(--dark);
    line-height: 1.1;
    margin-bottom: 0.5rem;
  }
  header p {
    font-size: 14px;
    color: var(--tan);
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* FILTER BAR */
  .filter-wrap {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .filter-btn {
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 5px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--tan);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
  .filter-btn.active { background: var(--gold); border-color: var(--gold); color: var(--white); }

  /* MAIN */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  /* SECTION */
  .section { margin-bottom: 2.5rem; }
  .section-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--tan);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  /* PRODUCT CARD */
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
  }
  .card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .card-img {
    width: 100%;
    aspect-ratio: 1;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-img .icon-placeholder {
    font-size: 2.5rem;
    opacity: 0.3;
  }
  .card-body {
    padding: 12px 14px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .card-category {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--tan);
  }
  .card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--dark);
    line-height: 1.3;
  }
  .card-note {
    font-size: 12px;
    color: var(--tan);
    line-height: 1.5;
    flex: 1;
    margin-top: 2px;
  }
  .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
  }
  .btn-shop {
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    background: var(--gold);
    color: var(--white);
    border: none;
    border-radius: 20px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background 0.15s;
  }
  .btn-shop:hover { background: var(--brown); }
  .btn-edit, .btn-delete {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--tan);
    transition: all 0.15s;
  }
  .btn-edit:hover { border-color: var(--gold); color: var(--gold); }
  .btn-delete:hover { border-color: #c0392b; color: #c0392b; }

  /* ADD BUTTON */
  .add-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 2rem;
  }
  .btn-add {
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    padding: 10px 24px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 24px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-add:hover { background: var(--gold); color: var(--white); }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--tan);
  }
  .empty p { font-size: 14px; margin-top: 0.5rem; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,16,8,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--white);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--dark);
    margin-bottom: 1.5rem;
  }
  .field { margin-bottom: 1.1rem; }
  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--tan);
    margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--cream);
    color: var(--dark);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
  .field textarea { resize: vertical; min-height: 70px; }
  .modal-btns {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 1.5rem;
  }
  .btn-cancel {
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    padding: 9px 20px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--tan);
    cursor: pointer;
  }
  .btn-save {
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    padding: 9px 24px;
    border: none;
    border-radius: 20px;
    background: var(--gold);
    color: var(--white);
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-save:hover { background: var(--brown); }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 2rem 1rem;
    font-size: 11px;
    color: var(--gold-light);
    border-top: 1px solid var(--border);
    letter-spacing: 0.05em;
  }

  @media (max-width: 600px) {
    header h1 { font-size: 2rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
</style>
</head>
<body>

<header>
  <div class="header-eyebrow">Haley's picks</div>
  <h1>My Amazon Favorites</h1>
  <p>Everything I actually use and love</p>
</header>

<div class="filter-wrap" id="filter-wrap">
  <button class="filter-btn active" data-cat="all">All</button>
  <button class="filter-btn" data-cat="beauty">Beauty</button>
  <button class="filter-btn" data-cat="home">Home</button>
  <button class="filter-btn" data-cat="fashion">Fashion</button>
  <button class="filter-btn" data-cat="clothing">Clothing</button>
  <button class="filter-btn" data-cat="wellness">Wellness</button>
  <button class="filter-btn" data-cat="other">Other</button>
</div>

<main>
  <div class="add-wrap">
    <button class="btn-add" onclick="openModal()">+ Add a product</button>
  </div>
  <div id="products-container"></div>
</main>

<footer>Made with love · Haley's Amazon Favorites</footer>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Add a product</h2>
    <div class="field">
      <label>Product name</label>
      <input type="text" id="f-name" placeholder="e.g. Aquaphor Healing Balm Stick">
    </div>
    <div class="field">
      <label>Amazon affiliate link</label>
      <input type="url" id="f-link" placeholder="https://amzn.to/...">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="f-category">
        <option value="beauty">Beauty</option>
        <option value="home">Home</option>
        <option value="fashion">Fashion</option>
        <option value="clothing">Clothing</option>
        <option value="wellness">Wellness</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="field">
      <label>Why you love it</label>
      <textarea id="f-note" placeholder="e.g. My go-to for dry lips and cuticles — keeps skin soft all day."></textarea>
    </div>
    <div class="field">
      <label>Image URL (optional)</label>
      <input type="url" id="f-image" placeholder="Paste an image link or leave blank">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveProduct()">Save product</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'haley_amazon_favorites';
const CATEGORY_ICONS = {
  beauty: '✨', home: '🏡', fashion: '👜', clothing: '👗', wellness: '🌿', other: '⭐'
};
const CATEGORY_LABELS = {
  beauty: 'Beauty', home: 'Home', fashion: 'Fashion', clothing: 'Clothing', wellness: 'Wellness', other: 'Other'
};

let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let activeCategory = 'all';
let editingId = null;

// Seed with Aquaphor if empty
if (products.length === 0) {
  products = [{
    id: Date.now(),
    name: 'Aquaphor Healing Balm Stick',
    link: 'https://amzn.to/4oG9Rep',
    category: 'beauty',
    note: 'My go-to for dry lips, cuticles, and skin — with avocado oil and shea butter.',
    image: ''
  }];
  save();
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
}

function render() {
  const filtered = activeCategory === 'all' ? products : products.filter(p => p.category === activeCategory);
  const container = document.getElementById('products-container');

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty"><div style="font-size:2rem">${CATEGORY_ICONS[activeCategory] || '⭐'}</div><p>No picks in this category yet.<br>Click "Add a product" to get started.</p></div>`;
    return;
  }

  const grouped = {};
  filtered.forEach(p => {
    if (!grouped[p.category]) grouped[p.category] = [];
    grouped[p.category].push(p);
  });

  let html = '';
  Object.keys(grouped).forEach(cat => {
    html += `<div class="section">`;
    if (activeCategory === 'all') {
      html += `<div class="section-label">${CATEGORY_LABELS[cat] || cat}</div>`;
    }
    html += `<div class="grid">`;
    grouped[cat].forEach(p => {
      html += `
        <div class="card">
          <div class="card-img">
            ${p.image ? `<img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='<span class=\\'icon-placeholder\\'>${CATEGORY_ICONS[p.category] || '⭐'}</span>'">` : `<span class="icon-placeholder">${CATEGORY_ICONS[p.category] || '⭐'}</span>`}
          </div>
          <div class="card-body">
            <div class="card-category">${CATEGORY_LABELS[p.category] || p.category}</div>
            <div class="card-name">${p.name}</div>
            <div class="card-note">${p.note || ''}</div>
            <div class="card-actions">
              <a class="btn-shop" href="${p.link}" target="_blank" rel="nofollow">Shop ↗</a>
              <button class="btn-edit" onclick="editProduct(${p.id})" title="Edit">✏️</button>
              <button class="btn-delete" onclick="deleteProduct(${p.id})" title="Delete">🗑</button>
            </div>
          </div>
        </div>`;
    });
    html += `</div></div>`;
  });

  container.innerHTML = html;
}

// Filters
document.getElementById('filter-wrap').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeCategory = e.target.dataset.cat;
  render();
});

// Modal
function openModal(product) {
  editingId = product ? product.id : null;
  document.getElementById('modal-title').textContent = product ? 'Edit product' : 'Add a product';
  document.getElementById('f-name').value = product?.name || '';
  document.getElementById('f-link').value = product?.link || '';
  document.getElementById('f-category').value = product?.category || 'beauty';
  document.getElementById('f-note').value = product?.note || '';
  document.getElementById('f-image').value = product?.image || '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

function saveProduct() {
  const name = document.getElementById('f-name').value.trim();
  const link = document.getElementById('f-link').value.trim();
  if (!name || !link) { alert('Please add at least a product name and link.'); return; }

  const product = {
    id: editingId || Date.now(),
    name,
    link,
    category: document.getElementById('f-category').value,
    note: document.getElementById('f-note').value.trim(),
    image: document.getElementById('f-image').value.trim()
  };

  if (editingId) {
    products = products.map(p => p.id === editingId ? product : p);
  } else {
    products.push(product);
  }

  save();
  render();
  closeModal();
}

function editProduct(id) {
  const p = products.find(p => p.id === id);
  if (p) openModal(p);
}

function deleteProduct(id) {
  if (!confirm('Remove this product?')) return;
  products = products.filter(p => p.id !== id);
  save();
  render();
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

render();
</script>
</body>
</html>
