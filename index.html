<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haley's Amazon Favorites</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #FAF6F0; --cream2: #F0EBE2; --gold: #B8946A; --gold-light: #D4B896;
    --dark: #1A1008; --brown: #4A3220; --tan: #9A7248; --white: #ffffff;
    --border: #E2D8CC; --radius: 12px;
  }
  body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--dark); min-height: 100vh; }
  header { background: var(--white); border-bottom: 1px solid var(--border); padding: 2rem 1.5rem 1.5rem; text-align: center; }
  .header-eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--tan); margin-bottom: 0.5rem; }
  header h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; font-weight: 500; color: var(--dark); line-height: 1.1; margin-bottom: 0.5rem; }
  header p { font-size: 14px; color: var(--tan); font-weight: 300; letter-spacing: 0.02em; }
  .filter-wrap { background: var(--white); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; position: sticky; top: 0; z-index: 10; }
  .filter-btn { font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 0.05em; padding: 5px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--tan); cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
  .filter-btn.active { background: var(--gold); border-color: var(--gold); color: var(--white); }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
  .section { margin-bottom: 2.5rem; }
  .section-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--tan); margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.2s, transform 0.15s; }
  .card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .card-img { width: 100%; aspect-ratio: 1; background: var(--cream); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-img .icon-placeholder { font-size: 2.5rem; opacity: 0.3; }
  .card-body { padding: 12px 14px 14px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .card-category { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--tan); }
  .card-name { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 500; color: var(--dark); line-height: 1.3; }
  .card-note { font-size: 12px; color: var(--tan); line-height: 1.5; flex: 1; margin-top: 2px; }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .btn-shop { font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 0.06em; padding: 6px 14px; background: var(--gold); color: var(--white); border: none; border-radius: 20px; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.15s; }
  .btn-shop:hover { background: var(--brown); }
  .loading { text-align: center; padding: 4rem 1rem; color: var(--tan); font-size: 14px; }
  .loading-spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--tan); }
  .empty p { font-size: 14px; margin-top: 0.5rem; }
  footer { text-align: center; padding: 2rem 1rem; font-size: 11px; color: var(--gold-light); border-top: 1px solid var(--border); letter-spacing: 0.05em; }
  @media (max-width: 600px) { header h1 { font-size: 2rem; } .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
</style>
</head>
<body>

<div style="background: #B8946A; text-align: center; padding: 12px 1rem; font-family: 'Jost', sans-serif; font-size: 14px; color: #fff; letter-spacing: 0.03em;">
  🛍 <strong>Prime Day is here!</strong> Filter by "Prime Deals" to shop my top picks on sale.
</div>

<div style="background: #F0EBE2; border-bottom: 1px solid #E2D8CC; text-align: center; padding: 10px 1rem; font-family: 'Jost', sans-serif; font-size: 13px; color: #4A3220; letter-spacing: 0.02em;">
  As an Amazon Associate I earn from qualifying purchases.
</div>

<header>
  <div class="header-eyebrow">Haley's picks</div>
  <h1>My Amazon Favorites</h1>
  <p>Everything I actually use and love</p>
</header>

<div class="filter-wrap" id="filter-wrap">
  <button class="filter-btn active" data-cat="all">All</button>
  <button class="filter-btn" data-cat="primedeals">🛍 Prime Deals</button>
  <button class="filter-btn" data-cat="beauty">Beauty</button>
  <button class="filter-btn" data-cat="home">Home</button>
  <button class="filter-btn" data-cat="kitchen">Kitchen</button>
  <button class="filter-btn" data-cat="fashion">Fashion</button>
  <button class="filter-btn" data-cat="clothing">Clothing</button>
  <button class="filter-btn" data-cat="wellness">Wellness</button>
  <button class="filter-btn" data-cat="other">Other</button>
</div>

<main>
  <div id="products-container">
    <div class="loading">
      <div class="loading-spinner"></div>
      Loading Haley's favorites...
    </div>
  </div>
</main>

<footer>Made with love · Haley's Amazon Favorites</footer>

<script>
const SHEET_CSV = 'https://corsproxy.io/?' + encodeURIComponent('https://docs.google.com/spreadsheets/d/e/2PACX-1vQMv1gAzPeLhnq_oEGd7uroAS5gsYHWy_ezlIyyVHj23s1HWDm3_ljeRXzrwY-H5Moh3EVo-Zm1gsMh/pub?gid=0&single=true&output=csv');

const CATEGORY_ICONS = {
  beauty: '✨', home: '🏡', kitchen: '🍳', fashion: '👜', clothing: '👗', wellness: '🌿', primedeals: '🛍', other: '⭐'
};
const CATEGORY_LABELS = {
  beauty: 'Beauty', home: 'Home', kitchen: 'Kitchen', fashion: 'Fashion', clothing: 'Clothing', wellness: 'Wellness', primedeals: 'Prime Deals', other: 'Other'
};

let products = [];
let activeCategory = 'all';

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
  return lines.slice(1).map(line => {
    const vals = [];
    let cur = '', inQuote = false;
    for (let i = 0; i < line.length; i++) {
      if (line[i] === '"') { inQuote = !inQuote; }
      else if (line[i] === ',' && !inQuote) { vals.push(cur); cur = ''; }
      else { cur += line[i]; }
    }
    vals.push(cur);
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
    return obj;
  }).filter(p => p.name);
}

async function loadProducts() {
  try {
    const res = await fetch(SHEET_CSV + '&t=' + Date.now());
    const text = await res.text();
    products = parseCSV(text);
    render();
  } catch (e) {
    document.getElementById('products-container').innerHTML =
      '<div class="empty"><p>Having trouble loading products. Please refresh the page.</p></div>';
  }
}

function render() {
  const filtered = activeCategory === 'all' ? products : products.filter(p => p.category === activeCategory);
  const container = document.getElementById('products-container');

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty"><div style="font-size:2rem">${CATEGORY_ICONS[activeCategory] || '⭐'}</div><p>No picks in this category yet.</p></div>`;
    return;
  }

  const grouped = {};
  filtered.forEach(p => {
    if (!grouped[p.category]) grouped[p.category] = [];
    grouped[p.category].push(p);
  });

  let html = '';
  Object.keys(grouped).forEach(cat => {
    html += `<div class="section">`;
    if (activeCategory === 'all') {
      html += `<div class="section-label">${CATEGORY_LABELS[cat] || cat}</div>`;
    }
    html += `<div class="grid">`;
    grouped[cat].forEach(p => {
      html += `
        <div class="card">
          <div class="card-img">
            ${p.image ? `<img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='<span class=\\'icon-placeholder\\'>${CATEGORY_ICONS[p.category] || '⭐'}</span>'">` : `<span class="icon-placeholder">${CATEGORY_ICONS[p.category] || '⭐'}</span>`}
          </div>
          <div class="card-body">
            <div class="card-category">${CATEGORY_LABELS[p.category] || p.category}</div>
            <div class="card-name">${p.name}</div>
            <div class="card-note">${p.note || ''}</div>
            <div class="card-actions">
              <a class="btn-shop" href="${p.link}" target="_blank" rel="nofollow">Shop ↗</a>
            </div>
          </div>
        </div>`;
    });
    html += `</div></div>`;
  });

  container.innerHTML = html;
}

document.getElementById('filter-wrap').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeCategory = e.target.dataset.cat;
  render();
});

loadProducts();
</script>
</body>
</html>
